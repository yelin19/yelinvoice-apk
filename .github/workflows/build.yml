name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 cmake;3.22.1 ndk;25.2.9519653"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"
      - name: Download and verify Whisper large-v3-turbo model
        run: |
          mkdir -p app/src/main/assets/whisper
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin" \
            --output app/src/main/assets/whisper/ggml-large-v3-turbo-q5_0.bin
          echo "e050f7970618a659205450ad97eb95a18d69c9ee  app/src/main/assets/whisper/ggml-large-v3-turbo-q5_0.bin" | sha1sum --check
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
